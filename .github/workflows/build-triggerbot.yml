
name: Build TriggerBot

on:
  workflow_dispatch:
  push:
    paths:
      - "triggerbot/**"
      - ".github/workflows/build-triggerbot.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Build mod
        working-directory: triggerbot
        run: gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: triggerbot-1.0.0
          path: triggerbot/build/libs/*.jar
